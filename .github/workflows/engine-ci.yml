name: Engine
on:
  push:
    branches: [main]
    paths: ['native/**', 'src/shared/contracts/engine.ts', 'src/main/engine/**', '.github/workflows/engine-ci.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  engine:
    runs-on: windows-latest
    env:
      # Same commit as builtin-baseline in native/engine/vcpkg.json.
      VCPKG_COMMIT: 20ceb8adbf0504d4b0d5e4058a32f9d4fc896391
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-bincache,readwrite
      ENGINE_EXE: ${{ github.workspace }}\native\engine\build\windows-release\adrenaline-engine.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Engine version (package.json)
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force vcpkg-bincache | Out-Null
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-x64-windows-static-${{ hashFiles('native/engine/vcpkg.json') }}
          restore-keys: vcpkg-x64-windows-static-
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@latest
      - name: vcpkg
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          git -C "$env:RUNNER_TEMP\vcpkg" checkout $env:VCPKG_COMMIT
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Configure (builds dependencies with vcpkg)
        working-directory: native/engine
        shell: pwsh
        run: cmake --preset windows-release "-DADRENALINE_VERSION=${{ steps.ver.outputs.version }}"
      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-x64-windows-static-${{ hashFiles('native/engine/vcpkg.json') }}
      - name: Build
        working-directory: native/engine
        run: cmake --build --preset windows-release
      - name: Dependencies (system DLLs only)
        shell: pwsh
        run: |
          dumpbin /dependents "$env:ENGINE_EXE"
          & "$env:ENGINE_EXE" --version
      - run: npm ci
      - name: Swarm test
        run: npm run test:engine
        env:
          ADRENALINE_ENGINE_PATH: ${{ env.ENGINE_EXE }}
      - uses: actions/upload-artifact@v4
        with:
          name: adrenaline-engine
          path: native/engine/build/windows-release/adrenaline-engine.exe
          if-no-files-found: error
