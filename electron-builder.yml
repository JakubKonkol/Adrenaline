appId: com.jakubkonkol.adrenaline
productName: Adrenaline
copyright: Copyright © 2026 Jakub Konkol
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/icons/**
  - package.json
asar: true
extraResources:
  - from: resources/engine/adrenaline-engine.exe
    to: engine/adrenaline-engine.exe
  - from: vendor/jackett
    to: jackett
    filter: ['**/*', '!**/*.pdb']
  - from: resources/licenses
    to: licenses
  # D-85: FFmpeg for TV playback (GPLv3, separate program; LICENSE and SOURCE.txt travel with it).
  - from: vendor/ffmpeg
    to: ffmpeg
    filter: ['**/*', '!.adrenaline-version']
  # D-79/D-81: the TV apps (Android APK, Tizen widget content) and their manifest with hashes.
  - from: resources/tv
    to: tv
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
  artifactName: Adrenaline-Setup-${version}.exe
  # English-only installer, like the app (D-77).
  multiLanguageInstaller: false
  installerLanguages: [en_US]
publish:
  provider: github
  owner: JakubKonkol
  repo: Adrenaline
  releaseType: release
