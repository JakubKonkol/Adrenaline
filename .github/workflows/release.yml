name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write # electron-builder creates the Release in this repo
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node scripts/check-version-tag.mjs "${{ github.ref_name }}"
      - run: npm run check
      - run: npm run build
      - run: npm run test:smoke

  engine:
    uses: ./.github/workflows/engine-ci.yml

  package:
    needs: [test, engine]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: adrenaline-engine
          path: resources/engine
      # etap 5: jackett (node scripts/fetch-jackett.mjs)
      - run: npm run build
      # The release is created as a draft first: electron-builder uploads files in parallel and, without an
      # existing release, may create two releases for one tag. The draft is published once all files are there.
      - name: Create draft release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes "Adrenaline ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and upload
        shell: bash
        run: npx electron-builder --win --x64 --publish always -c.publish.releaseType=draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then PRE=--prerelease; else PRE=--latest; fi
          gh release edit "$GITHUB_REF_NAME" --draft=false $PRE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
