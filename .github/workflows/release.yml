name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write # electron-builder creates the Release in this repo
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node scripts/check-version-tag.mjs "${{ github.ref_name }}"
      # Real FFmpeg pipeline tests (src/main/media/ffmpeg-real.test.ts) run when the binaries are there.
      - run: node scripts/fetch-ffmpeg.mjs
      - run: npm run check
      - run: npm run build
      - run: npm run test:smoke

  engine:
    uses: ./.github/workflows/engine-ci.yml

  tv-android:
    uses: ./.github/workflows/tv-android.yml
    secrets: inherit

  package:
    needs: [test, engine, tv-android]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: adrenaline-engine
          path: resources/engine
      - run: node scripts/fetch-jackett.mjs
      # D-85: pinned FFmpeg (SHA-256 in scripts/ffmpeg-sha256.txt), shipped with its GPL licence and source link.
      - run: node scripts/fetch-ffmpeg.mjs
      # TV apps (D-79): Tizen widget content from the TV web build, the APK from the tv-android job, the manifest.
      - run: npm run build:tv
      - run: node scripts/tv/prepare-tizen.mjs
      - uses: actions/download-artifact@v4
        with:
          name: adrenaline-tv-apk
          path: tv-apk
      - name: TV manifest
        shell: bash
        run: ADRENALINE_ANDROID_SIGNING="$(cat tv-apk/signing.txt)" node scripts/tv/write-manifest.mjs tv-apk/app-release.apk
      - uses: actions/download-artifact@v4
        with:
          name: engine-licenses
          path: resources/licenses/engine
      - run: npm run build
      # The release is created as a draft first: electron-builder uploads files in parallel and, without an
      # existing release, may create two releases for one tag. The draft is published once all files are there.
      - name: Create draft release
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release-state.json; then
            node -e "if(!require('./release-state.json').isDraft) process.exit(1)"
          else
            LABEL="Adrenaline ${GITHUB_REF_NAME#v}"
            if [[ "$GITHUB_REF_NAME" == "v0.9.0" ]]; then LABEL="$LABEL — beta (acceptance checklist in docs/manual-tests.md)"; fi
            NOTES="docs/releases/${GITHUB_REF_NAME#v}.md"
            if [[ -f "$NOTES" ]]; then
              gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes-file "$NOTES"
            else
              gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}" --notes "$LABEL"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and upload
        shell: bash
        run: npx electron-builder --win --x64 --publish always -c.publish.releaseType=draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets > release-assets.json
          node scripts/check-release-assets.mjs release-assets.json "$GITHUB_REF_NAME"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then PRE=--prerelease; else PRE=--latest; fi
          gh release edit "$GITHUB_REF_NAME" --draft=false $PRE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
